# .github/workflows/harness-health.yml
# Monthly, zero-token health check of the harness itself. Runs the deterministic
# validators; on failure opens (or updates in place) one `chore` issue titled
# "Harness health <YYYY-MM>". The LLM half (asking claude-code-guide what changed
# in Claude Code) runs only when a human invokes /harness-health in a session.

name: Harness health

on:
  schedule:
    - cron: '17 6 1 * *'   # 06:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0   # wiki_lint derives staleness from git history
          persist-credentials: false   # the validators below run repo code; only the final gh step gets a token

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet 'pytest>=8,<9' 'pyyaml>=6,<7'

      - name: Run validators
        id: checks
        shell: bash
        run: |
          set +e
          {
            echo '## Harness health — '"$(date -u +%Y-%m)"
            echo
            echo '```'
            python3 scripts/audit_claude_md.py --strict;        echo "audit_claude_md: exit $?"
            python3 scripts/adoption_check.py;                  echo "adoption_check: exit $?"
            python3 scripts/validate_agent_memory.py --check-roster; echo "validate_agent_memory: exit $?"
            python3 scripts/wiki_lint.py --all;                 echo "wiki_lint: exit $?"
            bash scripts/leak_gate.sh;                          echo "leak_gate (path rules only in CI): exit $?"
            bash scripts/coupling_lint.sh --summary;            echo "coupling_lint: exit $?"
            python3 -m pytest tests/harness -q;                 echo "harness tests: exit $?"
            echo '```'
          } > report.md
          if grep -qE 'exit [1-9]' report.md; then echo "failed=true" >> "$GITHUB_OUTPUT"; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi
          cat report.md

      - name: Open or update the health issue
        if: steps.checks.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Harness health $(date -u +%Y-%m)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "$title" --label chore --label needs-triage --body-file report.md
          fi
