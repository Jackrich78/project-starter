# .github/workflows/validate.yml
# Harness validation for Project Starter. Runs on every push and PR.
# Steps marked CUSTOMIZE are where a project adds its own checks.

name: Validate

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned by commit SHA (the tag in the comment is for humans): a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0   # wiki_lint derives staleness from git history
          persist-credentials: false   # repo scripts run below; they get no token

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '20'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'   # matches .python-version when present; py_compile below runs on every tracked .py

      - name: Install test deps
        run: pip install --quiet 'pytest>=8,<9' 'pyyaml>=6,<7'

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7   # v2.2.0

      - name: Hook and script syntax
        run: git ls-files "*.py" | xargs python3 -m py_compile

      - name: CLAUDE.md audit
        run: python3 scripts/audit_claude_md.py --strict

      - name: Wiki lint (structural)
        run: python3 scripts/wiki_lint.py --all

      - name: Leak gate (path rules; private patterns never ship)
        run: bash scripts/leak_gate.sh

      - name: Coupling lint (no private-product leftovers)
        run: bash scripts/coupling_lint.sh

      - name: Harness tests
        # pytest directly, not `npm test`, which degrades to a notice without pytest; CI must not
        run: python3 -m pytest tests/harness -q

      # Project tests: the lane `npm test -- project` runs locally (tests/unit, tests/integration via uv).
      # Both steps are skipped until the project has a pyproject.toml; CUSTOMIZE for a non-Python stack.
      - name: Project deps (uv, locked)
        if: hashFiles('pyproject.toml') != ''
        run: pip install --quiet 'uv>=0.11,<0.12' && uv sync --frozen

      - name: Project tests
        if: hashFiles('pyproject.toml') != ''
        run: uv run --frozen pytest tests/unit tests/integration -q

  cold-clone:
    name: Cold clone smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          path: template
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '20'
      - name: Clone the way an adopter would (no history, no node_modules, no Python deps)
        run: |
          git clone --depth 1 "file://$PWD/template" my-project
          cd my-project
          npm test                                   # must degrade to a notice without pytest and exit 0
          node scripts/run_pytest_optional.mjs
          test -f CLAUDE.md && test -f PROJECT.md && test -d .claude/skills/setup
          python3 scripts/adoption_check.py
          bash scripts/github/check_gh.sh --quiet || echo "gh checks fail without auth (expected in CI)"
